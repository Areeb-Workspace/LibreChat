# Configuration version (required)
version: 1.2.1

# Cache settings
cache: false

# Balance system configuration
balance:
  enabled: true
  startBalance: 0 # Laravel will set this on login
  autoRefillEnabled: false


endpoints:
  custom:
    - name: 'OpenRouter'
      # For `apiKey` and `baseURL`, you can use environment variables that you define.
      # recommended environment variables:
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default: ['meta-llama/llama-3-70b-instruct']
        fetch: true
      titleConvo: true
      titleModel: 'meta-llama/llama-3-70b-instruct'
      # Recommended: Drop the stop parameter from the request as Openrouter models use a variety of stop tokens.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
 

mcpSettings:
  allowedDomains:
    - 'host.docker.internal'        
    - 'localhost'                   
    - '*.example.com'               
    - 'secure.api.com'      
    - 'mcp.clickhouse.cloud'
    - 'video.dev.mcp.arm.areeb.me'
    - 'deepsearch.dev.mcp.arm.areeb.me'
    - 'uiux.dev.mcp.arm.areeb.me'
    - 'vision.dev.mcp.arm.areeb.me'
    - 'presentation.dev.mcp.arm.areeb.me'

mcpServers:
  visual-memory-agent:
    type: sse
    url: https://vision.dev.mcp.arm.areeb.me/sse
    headers:
      Authorization: "Bearer ${VISUAL_MEMORY_MCP_ACCESS_TOKEN}"
  uiux-mcp:
    type: sse
    url: https://uiux.dev.mcp.arm.areeb.me/sse
    headers:
      Authorization: 'Bearer ${UIUX_MCP_ACCESS_TOKEN}'
  video-dispatcher:
    type: sse
    url: https://video.dev.mcp.arm.areeb.me/sse
    timeout: 600000
    headers:
      Authorization: "Bearer ${VIDEO_GENERATOR_MCP_ACCESS_TOKEN}"
  deepsearch-mcp:
    type: streamable-http
    url: https://deepsearch.dev.mcp.arm.areeb.me/mcp
    headers:
      Authorization: 'Bearer ${DEEP_SEARCH_MCP_ACCESS_TOKEN}'
    timeout: 120000
  presentation-mcp:
    type: streamable-http
    url: https://presentation.dev.mcp.arm.areeb.me/mcp
    headers:
      Authorization: 'Bearer ${PRESENTATION_MCP_ACCESS_TOKEN}'
  strapi:
    type: streamable-http
    url: http://host.docker.internal:8001/mcp
    startup: false
    headers:
      Authorization: "Bearer ${STRAPI_MCP_ACCESS_TOKEN}"
      x-user-email: "{{LIBRECHAT_USER_EMAIL}}"
      x-api-key: "${STRAPI_API_KEY}"
      x-user-role: "{{LIBRECHAT_USER_ROLE}}"
  clickhouse-cloud:
    type: streamable-http
    url: https://mcp.clickhouse.cloud/mcp